name: Run the synthetic OpenSAFELY workflow
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the validated OpenSAFELY CLI
        run: python -m pip install opensafely==1.56.8
      - name: Create synthetic source tables
        run: python analysis/local/make_dummy_tables.py --n 16000
      - name: Execute the production graph on synthetic tables
        run: python analysis/local/run_local.py --fresh
      - name: Confirm production YAML was restored
        if: always()
        run: |
          if grep -q -- '--dummy-' project.yaml; then
            echo 'A local dummy override was left in production YAML'
            exit 1
          fi
